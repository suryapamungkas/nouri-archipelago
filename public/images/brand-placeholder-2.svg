<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="40%" stop-color="#8b5e3c"/>
      <stop offset="100%" stop-color="#3c2415"/>
    </linearGradient>
    <radialGradient id="coffeeGlow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8c9a0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3c2415" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#coffeeGrad)"/>
  <rect width="400" height="500" fill="url(#coffeeGlow)"/>
  <!-- Coffee bean shapes -->
  <g opacity="0.2">
    <ellipse cx="120" cy="130" rx="28" ry="18" fill="#5a3a20" transform="rotate(-20 120 130)"/>
    <line x1="105" y1="122" x2="135" y2="138" stroke="#3c2415" stroke-width="1.5" transform="rotate(-20 120 130)"/>
  </g>
  <g opacity="0.15">
    <ellipse cx="300" cy="100" rx="24" ry="15" fill="#4a2d18" transform="rotate(15 300 100)"/>
    <line x1="288" y1="93" x2="312" y2="107" stroke="#3c2415" stroke-width="1.2" transform="rotate(15 300 100)"/>
  </g>
  <g opacity="0.12">
    <ellipse cx="80" cy="350" rx="22" ry="14" fill="#5a3a20" transform="rotate(30 80 350)"/>
    <line x1="68" y1="343" x2="92" y2="357" stroke="#3c2415" stroke-width="1" transform="rotate(30 80 350)"/>
  </g>
  <g opacity="0.18">
    <ellipse cx="330" cy="300" rx="26" ry="16" fill="#4a2d18" transform="rotate(-25 330 300)"/>
    <line x1="316" y1="292" x2="344" y2="308" stroke="#3c2415" stroke-width="1.3" transform="rotate(-25 330 300)"/>
  </g>
  <!-- Swirling chocolate/coffee liquid -->
  <path d="M50 250 Q150 200 200 260 Q250 320 350 270" fill="none" stroke="#d4a574" stroke-width="2" opacity="0.15"/>
  <path d="M30 280 Q130 230 200 290 Q270 350 370 300" fill="none" stroke="#e8c9a0" stroke-width="1.5" opacity="0.1"/>
  <!-- Steam wisps -->
  <path d="M170 180 Q175 150 185 170 Q195 190 200 160" fill="none" stroke="#e8c9a0" stroke-width="1" opacity="0.2"/>
  <path d="M210 175 Q215 145 225 165 Q235 185 240 155" fill="none" stroke="#d4a574" stroke-width="0.8" opacity="0.18"/>
  <!-- Warm circular elements -->
  <circle cx="200" cy="240" r="70" fill="#8b5e3c" opacity="0.08"/>
  <circle cx="200" cy="240" r="50" fill="#d4a574" opacity="0.06"/>
  <!-- Chocolate drizzle curves -->
  <path d="M100 380 Q150 360 200 380 Q250 400 300 380" fill="none" stroke="#5a3a20" stroke-width="3" opacity="0.1" stroke-linecap="round"/>
  <!-- Brand label area -->
  <rect x="60" y="400" width="280" height="60" rx="4" fill="#1a0d05" opacity="0.3"/>
  <text x="200" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#f0e0c8" font-weight="600" letter-spacing="2">COFFEE</text>
  <text x="200" y="448" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#d4a574" letter-spacing="3">ORIGINS</text>
</svg>
