<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="berryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8b4c8"/>
      <stop offset="40%" stop-color="#9b3a6a"/>
      <stop offset="100%" stop-color="#5c1a3a"/>
    </linearGradient>
    <radialGradient id="berryGlow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#f0d0e0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5c1a3a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#berryGrad)"/>
  <rect width="400" height="500" fill="url(#berryGlow)"/>
  <!-- Berry cluster shapes -->
  <g opacity="0.2">
    <circle cx="180" cy="160" r="18" fill="#7a2a50"/>
    <circle cx="205" cy="150" r="16" fill="#8b3a60"/>
    <circle cx="195" cy="175" r="15" fill="#6a2040"/>
    <circle cx="220" cy="168" r="14" fill="#7a2a50"/>
    <!-- Berry highlight dots -->
    <circle cx="175" cy="155" r="3" fill="#e8b4c8" opacity="0.4"/>
    <circle cx="200" cy="145" r="2.5" fill="#e8b4c8" opacity="0.35"/>
    <circle cx="190" cy="170" r="2" fill="#e8b4c8" opacity="0.3"/>
  </g>
  <!-- Second berry cluster -->
  <g opacity="0.14" transform="translate(80 200)">
    <circle cx="180" cy="160" r="14" fill="#7a2a50"/>
    <circle cx="200" cy="152" r="12" fill="#8b3a60"/>
    <circle cx="190" cy="172" r="13" fill="#6a2040"/>
    <circle cx="175" cy="155" r="2.5" fill="#e8b4c8" opacity="0.4"/>
  </g>
  <!-- Leaf shapes for berries -->
  <path d="M160 135 Q140 110 155 90 Q165 105 170 120 Q168 128 160 135Z" fill="#3a6a40" opacity="0.2"/>
  <path d="M230 140 Q250 115 240 95 Q232 108 225 122 Q226 132 230 140Z" fill="#3a6a40" opacity="0.15"/>
  <!-- Flowing juice splashes -->
  <path d="M80 280 Q150 250 200 280 Q250 310 320 280" fill="none" stroke="#e8b4c8" stroke-width="2" opacity="0.15"/>
  <path d="M60 310 Q140 280 200 310 Q260 340 340 310" fill="none" stroke="#9b3a6a" stroke-width="1.5" opacity="0.1"/>
  <!-- Scattered fruit seeds -->
  <g fill="#5c1a3a" opacity="0.1">
    <ellipse cx="70" cy="120" rx="4" ry="7" transform="rotate(30 70 120)"/>
    <ellipse cx="330" cy="200" rx="3.5" ry="6" transform="rotate(-20 330 200)"/>
    <ellipse cx="90" cy="380" rx="3" ry="5.5" transform="rotate(45 90 380)"/>
    <ellipse cx="310" cy="360" rx="4" ry="7" transform="rotate(-35 310 360)"/>
  </g>
  <!-- Soft circular elements -->
  <circle cx="200" cy="250" r="60" fill="#9b3a6a" opacity="0.06"/>
  <circle cx="150" cy="300" r="40" fill="#e8b4c8" opacity="0.05"/>
  <circle cx="280" cy="280" r="45" fill="#7a2a50" opacity="0.06"/>
  <!-- Brand label area -->
  <rect x="60" y="400" width="280" height="60" rx="4" fill="#3c0d22" opacity="0.3"/>
  <text x="200" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#f0d0e0" font-weight="600" letter-spacing="2">BERRY BLISS</text>
  <text x="200" y="448" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#e8b4c8" letter-spacing="3">NATURALS</text>
</svg>
