<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a7a50"/>
      <stop offset="100%" stop-color="#2d5a3d"/>
    </linearGradient>
  </defs>
  <!-- Leaf/grain motif -->
  <g transform="translate(10, 8)">
    <!-- Left leaf -->
    <path d="M18 42 Q8 30 12 16 Q16 8 22 4 Q20 14 20 24 Q20 34 18 42Z" fill="url(#leafGrad)" opacity="0.9"/>
    <!-- Right leaf -->
    <path d="M22 42 Q32 30 28 16 Q24 8 18 4 Q20 14 20 24 Q20 34 22 42Z" fill="#2d5a3d" opacity="0.7"/>
    <!-- Grain dot cluster -->
    <circle cx="20" cy="6" r="2.5" fill="#2d5a3d"/>
    <circle cx="15" cy="10" r="1.8" fill="#3a7a50"/>
    <circle cx="25" cy="10" r="1.8" fill="#3a7a50"/>
    <!-- Stem -->
    <line x1="20" y1="24" x2="20" y2="44" stroke="#2d5a3d" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Company name - elegant serif style -->
  <text x="52" y="28" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#2d5a3d" letter-spacing="1.5">NUSANTARA</text>
  <text x="52" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="400" fill="#3a7a50" letter-spacing="4">GLOBAL</text>
  <!-- Subtle underline accent -->
  <line x1="52" y1="50" x2="148" y2="50" stroke="#2d5a3d" stroke-width="0.5" opacity="0.4"/>
</svg>
